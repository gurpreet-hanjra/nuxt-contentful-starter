name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # postinstall runs `nuxt prepare`, which generates .nuxt/ types for typecheck.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # No Contentful keys in CI: the build uses mock content, which is enough to prove it compiles.
      - run: npm run build
